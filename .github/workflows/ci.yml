name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: project
        run: ruff check src tests connectors

      - name: Test
        working-directory: project
        run: pytest -q -m "not integration"

  integration:
    name: Milvus integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start Milvus 2.5.6
        run: |
          mkdir -p "$RUNNER_TEMP/milvus/volumes/milvus"
          cp 已有资源/环境/milvus/embedEtcd.yaml "$RUNNER_TEMP/milvus/"
          cp 已有资源/环境/milvus/user.yaml "$RUNNER_TEMP/milvus/"
          docker run -d --name milvus-ci \
            --security-opt seccomp=unconfined \
            -e ETCD_USE_EMBED=true \
            -e ETCD_DATA_DIR=/var/lib/milvus/etcd \
            -e ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml \
            -e COMMON_STORAGETYPE=local \
            -e DEPLOY_MODE=STANDALONE \
            -v "$RUNNER_TEMP/milvus/volumes/milvus:/var/lib/milvus" \
            -v "$RUNNER_TEMP/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml" \
            -v "$RUNNER_TEMP/milvus/user.yaml:/milvus/configs/user.yaml" \
            -p 19530:19530 -p 9091:9091 -p 2379:2379 \
            milvusdb/milvus:v2.5.6 milvus run standalone
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://localhost:9091/healthz >/dev/null; then
              echo "Milvus healthy"
              break
            fi
            sleep 2
          done
          if ! curl -sf --max-time 2 http://localhost:9091/healthz >/dev/null; then
            docker logs --tail 100 milvus-ci
            exit 1
          fi

      - name: Install
        working-directory: project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,milvus]"

      - name: Integration tests
        working-directory: project
        env:
          MILVUS_URI: http://localhost:19530
          MILVUS_DB: ci_rag
          MILVUS_COLLECTION: ci_chunks
        run: pytest -q -m integration

      - name: Stop Milvus
        if: always()
        run: docker rm -f milvus-ci || true

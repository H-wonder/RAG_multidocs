[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docparse"
version = "0.2.0"
description = "Local multimodal document parsing with Xiaomi-OCR-0 and Ollama"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "numpy",
    "wordfreq",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
]

[project.optional-dependencies]
region = ["paddlepaddle", "paddlex[cv]", "shapely"]

[project.scripts]
docparse = "docparse.cli:main"

[tool.setuptools.packages.find]
include = ["docparse*"]

[tool.setuptools.package-data]
docparse = ["vendor/LICENSE-Xiaomi-OCR-0.txt"]

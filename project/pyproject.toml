[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-multidocs"
version = "0.1.0"
description = "Plugin-based multimodal document ingestion and retrieval"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
milvus = [
    "pymilvus>=2.5",
]
embed = [
    "sentence-transformers>=4.0",
]

[project.scripts]
rag-cli = "rag_multidocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires an external service (Milvus)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
